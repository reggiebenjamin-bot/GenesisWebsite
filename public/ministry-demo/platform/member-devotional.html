<style>
  /* Member devotional only. Prefix: md-. Church tokens (--m-*) only inside the phone. */
  .md-days{display:grid;grid-template-columns:repeat(7,minmax(44px,1fr));gap:4px;margin:0;padding:0;list-style:none}
  /* Below 380px the week scrolls inside its own strip, so every day stays 44px wide down to a 320px phone. */
  @media (max-width:379px){.md-days{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:46px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px}.md-days li{scroll-snap-align:start}}
  .m-app .md-day{width:100%;min-width:44px;min-height:58px;display:grid;place-items:center;align-content:center;gap:1px;padding:6px 0;border:1.5px solid var(--m-line);border-radius:var(--m-radius);background:var(--m-surface);color:var(--m-text);font:inherit;cursor:pointer}
  .md-day b{font-size:16px;line-height:1.1}
  .m-app .md-day small{font-size:12px;letter-spacing:0;color:var(--m-muted);line-height:1.2}
  .m-app .md-day[aria-pressed="true"]{border-color:var(--m-accent);background:var(--m-accent);color:var(--m-on-accent)}
  .m-app .md-day[aria-pressed="true"] small{color:var(--m-on-accent)}
  /* Days still to come read "Soon" in full-contrast type on a dashed outline, not a faded button. */
  .m-app .md-day:disabled{opacity:1;cursor:default;background:transparent;border-style:dashed;color:var(--m-text)}
  .m-app .md-day:disabled small{color:var(--m-text)}
  .m-app .md-meta{margin:4px 0 0;color:var(--m-muted);font-size:14px}
  .m-app .md-verse{margin:0;padding:14px 16px;border:1px solid var(--m-line);border-left:3px solid var(--m-accent-ink);border-radius:0 var(--m-radius-lg) var(--m-radius-lg) 0;background:var(--m-surface)}
  .md-verse b{display:block;color:var(--m-accent-ink);font-size:14px}
  .m-app .md-verse p{margin:6px 0;font-size:calc(18px * var(--mx-read,1));line-height:1.6}
  .md-verse small{color:var(--m-muted);font-size:13px}
  /* The reading: 18px with 1.65 line height, as on the website, and never wider than about 34em. */
  .m-app .md-paras,.m-app .md-prayer,.m-app .md-verse{max-width:34em}
  .m-app .md-paras p{margin:0 0 14px;font-size:calc(18px * var(--mx-read,1));line-height:1.65}
  /* The Classic and Timeless look reads like a book: the church's serif for the reading and the verse. */
  .m-app[data-church="classic-timeless"] .md-paras p,.m-app[data-church="classic-timeless"] .md-verse p{font-family:var(--m-display);font-size:calc(18px * var(--mx-read,1));line-height:1.65}

  .md-prayer b{display:block;margin-bottom:4px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--m-accent-ink)}
  .m-app .md-prayer p{margin:0;font-size:calc(17.5px * var(--mx-read,1));line-height:1.6;font-style:normal}

  .m-app .md-email-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px}

  .m-app .md-email-row .m-link{display:inline-flex;align-items:center;min-height:44px;font-size:15px}

<script>
/* ==== Member stage. The same function sits on every member page (prefix mx-). ====
   Dresses the stage the shell draws around the phone in the Genesis OS shell: the real sample
   strip, the brand block, v2 buttons and Take the Tour, and on wide screens a page head with
   what this screen protects (left) and the member app's screens (right). The phone is untouched.
   o = { title (HTML with em.v2-accent-em), sub, protect: [[bold, line], ...], land: { href, label, icon, module } }
   land.module: the plan module of the screen it opens; outside the plan shown, the link carries the plan lock. */
function mxStage(o) {
  "use strict";
  var body = document.body, stage = document.querySelector(".m-stage");
  if (!stage || body.classList.contains("mx-staged")) return;
  var esc = GM.esc, c = GM.church, D = GM.data, here = location.pathname.split("/").pop() || "member-home.html";
  body.classList.add("mx-staged");
  body.insertAdjacentHTML("beforeend", GM.previewStripHTML());

  var bar = stage.querySelector(".m-stagebar");
  var brand = bar.querySelector(".m-stage-brand");
  if (brand) { brand.querySelector("b").textContent = "Genesis"; brand.querySelector("small").textContent = "Member App"; }
  var desk = bar.querySelector(".m-stage-desk");
  if (desk) desk.className = "v2-button m-stage-desk";
  var theme = bar.querySelector(".gm-theme-btn");
  if (theme) theme.className = "v2-button v2-icon-button v2-button-quiet gm-theme-btn";
  var tour = document.createElement("button");
  tour.type = "button";
  tour.className = "v2-button v2-button-quiet gm-tour-btn mx-tour";
  tour.setAttribute("data-gm-action", "start-tour");
  tour.setAttribute("aria-label", "Take the Tour");
  tour.title = "Take the Tour";
  tour.innerHTML = GM.v2Icon("help") + "<span>Take the Tour</span>";
  tour.hidden = !!(GM.ctx && GM.ctx.locked);
  bar.insertBefore(tour, desk || theme || null);

  var SCREENS = [
    ["member-signin.html", "Sign In", "member-app"], ["member-welcome.html", "First Question", "member-app"],
    ["member-home.html", "Home", "member-app"], ["member-notes.html", "Sunday's Notes", "member-app"],
    ["member-devotional.html", "Devotional", "member-app"], ["member-prayer.html", "Prayer", "member-app"],
    ["member-messages.html", "Messages", "member-app"], ["member-give.html", "Give", "member-app"],
    ["member-gifts.html", "Gifts Conversation", "member-gifts"], ["member-gifts-result.html", "Gifts to Explore", "member-gifts"]
  ];
  var nav = SCREENS.map(function (s) {
    var code = D.levels[GM.moduleLevel(s[2]) - 1].code, locked = !GM.isIncluded(s[2]);
    return '<a href="' + s[0] + '"' + (s[0] === here ? ' aria-current="page"' : "") + "><span>" + esc(s[1]) + "</span>" +
      (locked ? '<em class="gm-nav-lock" title="Included in ' + esc(code) + '">' + GM.icon("lock") + esc(code) + '</em><span class="sr-only">, included in ' + esc(code) + "</span>" : "") + "</a>";
  }).join("");
  var landLock = "";
  if (o.land && o.land.module && !GM.isIncluded(o.land.module)) {
    var landCode = D.levels[GM.moduleLevel(o.land.module) - 1].code;
    landLock = '<em class="gm-nav-lock" title="Included in ' + esc(landCode) + '" aria-hidden="true">' + GM.icon("lock") + esc(landCode.replace("Level ", "L")) + '</em><span class="sr-only">, included in ' + esc(landCode) + "</span>";
  }
  var protect = (o.protect || []).map(function (p) { return "<li><b>" + esc(GM.fill(p[0])) + "</b><span>" + esc(GM.fill(p[1])) + "</span></li>"; }).join("");
  var about = '<aside class="mx-about" aria-labelledby="mx-about-title">' +
    '<header class="v2-page-head"><div><div class="v2-eyebrow">Member app · ' + esc(c.short) + "</div>" +
    '<h2 class="v2-serif-title" id="mx-about-title">' + o.title + "</h2><p>" + esc(GM.fill(o.sub)) + "</p></div></header>" +
    (protect ? '<section class="v2-card mx-card" aria-label="How this screen protects people"><div class="v2-eyebrow">How it protects people</div><ul class="gm-protect-list">' + protect + "</ul></section>" : "") +
    (o.land ? '<a class="v2-button mx-land" href="' + esc(o.land.href) + '">' + GM.v2Icon(o.land.icon || "arrow") + "<span>" + esc(o.land.label) + "</span>" + landLock + "</a>" : "") +
    "</aside>";
  var screens = '<nav class="v2-card mx-screens" aria-label="Member app screens"><div class="v2-eyebrow">Member app screens</div><div class="v2-rail-nav">' + nav + "</div>" +
    '<p class="mx-fine">Every screen wears ' + esc(GM.poss(c.name)) + " own brand. Powered by Genesis.</p></nav>";
  var device = stage.querySelector(".m-device");
  device.insertAdjacentHTML("afterend", about + screens);
}
</script><!-- end member stage -->

/* Reading comfort (the same on member-notes.html and member-devotional.html): text size A- and A+, and on the
   bright looks Night Reading, kept on this phone in localStorage when it can be, and fine without it. */
function mxRead(slot) {
  "use strict";
  var app = document.querySelector(".m-app") || document.body, KEY = "gm.m.read", SIZES = [1, 1.12, 1.25, 1.4];
  var bright = !GM.church.theme || GM.church.theme.scheme !== "dark";
  var st = { size: 0, night: false };
  try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v) { st.size = Math.max(0, Math.min(SIZES.length - 1, +v.size || 0)); st.night = !!v.night; } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function apply() {
    app.style.setProperty("--mx-read", String(SIZES[st.size]));
    app.classList.toggle("mx-night", bright && st.night);
    slot.innerHTML = '<button type="button" class="m-btn" data-mx-size="-1" aria-label="Smaller text"' + (st.size === 0 ? " disabled" : "") + ">A−</button>" +
      '<button type="button" class="m-btn" data-mx-size="1" aria-label="Larger text"' + (st.size === SIZES.length - 1 ? " disabled" : "") + ">A+</button>" +
      (bright ? '<button type="button" class="m-btn" data-mx-night aria-pressed="' + st.night + '">Night Reading</button>' : "");
  }
  slot.classList.add("mx-read"); slot.setAttribute("role", "group"); slot.setAttribute("aria-label", "Reading");
  slot.addEventListener("click", function (e) {
    var s = e.target.closest("[data-mx-size]"), n = e.target.closest("[data-mx-night]");
    if (s && !s.disabled) { st.size = Math.max(0, Math.min(SIZES.length - 1, st.size + +s.getAttribute("data-mx-size"))); save(); apply(); var b = slot.querySelector('[data-mx-size="' + s.getAttribute("data-mx-size") + '"]'); (b && !b.disabled ? b : slot.querySelector("[data-mx-size]:not([disabled])")).focus(); }
    if (n) { st.night = !st.night; save(); apply(); slot.querySelector("[data-mx-night]").focus(); }
  });
  apply();
}
</script>

  land: { href: "church-notes.html?view=devotionals", label: "See the Devotionals Screen", icon: "note", module: "devotionals" }
});
GM.ready(function (ctx) {
  "use strict";
  var esc = GM.esc, c = ctx.church, N = window.GM_NOTES, NC = N.church(c.slug);
  var $ = function (id) { return document.getElementById(id); };
  var today = N.today;
  /* The pastor's own preview of Sunday's devotional draft (church-note.html, Preview on Phone). */
  var prevId = ctx.params.get("preview"), prev = prevId ? NC.devotionals.filter(function (d) { return d.id === prevId && d.status === "draft"; })[0] : null;
  var days = NC.devotionals.map(function (d) { return d === prev ? N.shaped(d) : d; });
  function open(d) { return d.date <= today || (prev && d.id === prev.id); }
  var want = ctx.params.get("day");
  var pick = (prev && days.filter(function (d) { return d.id === prev.id; })[0]) || days.filter(function (d) { return d.date === want && d.date <= today; })[0] || N.todays(c.slug) || days[0];
  var emailOn = true, shareOpen = false, listenOpen = false;
  var back = ""; try { back = sessionStorage.getItem("gm.notes.back") || ""; } catch (e) {}
  if (prev) { $("md-sched").hidden = false; $("md-sched").innerHTML = GM.icon("info") + "<span>Preview: members see this on " + esc(N.dateLong(prev.date)) + " at 6 AM, after you tap Schedule. Demo only. Nothing was sent." + (back ? ' <a href="' + esc(back) + '">Back to the Editor</a>' : "") + "</span>"; }

  function paintDays() {
    $("md-days").innerHTML = days.map(function (d) {
      var future = !open(d), sel = d.date === pick.date;
      return "<li><button type=\"button\" class=\"md-day\" data-md-day=\"" + esc(d.date) + "\" aria-pressed=\"" + sel + "\"" + (future ? " disabled" : "") +
        ' aria-label="' + esc(N.dateLong(d.date) + (future ? ", arrives " + N.weekday(d.date) + " at 6 AM" : d.date === today ? ", today" : "")) + '">' +
        '<small aria-hidden="true">' + esc(N.dayShort(d.date)) + '</small><b aria-hidden="true">' + N.dayNum(d.date) + '</b><small aria-hidden="true">' + (future ? "Soon" : d.date === today ? "Today" : "&nbsp;") + "</small></button></li>";
    }).join("");
  }
  function idx() { return days.indexOf(pick); }
  function paintReading() {
    var d = pick;
    $("md-date").textContent = d.date === today ? "Today · " + N.dateLong(d.date) : N.dateLong(d.date);
    $("md-title").textContent = d.title;
    $("md-meta").innerHTML = 'Read time: <span class="md-nowrap">' + N.readMins(d) + " min</span>";
    /* Listening: only a reading that came in as the pastor's voice memo offers it, and the words stay the main way in. */
    $("md-listen").hidden = !d.heard;
    if (d.heard) {
      $("md-listen").innerHTML = '<button type="button" class="m-btn" id="md-listen-btn" aria-expanded="' + listenOpen + '" aria-controls="md-listen-note">' + GM.icon("play") + "Listen to " + esc(N.speaker(d, c.pastors)) + "</button>" +
        '<p class="m-note" id="md-listen-note" role="status"' + (listenOpen ? "" : " hidden") + ">" + GM.icon("info") + "<span>Demo only. No sound plays here. On a real church app, this plays " + esc(N.speaker(d, c.pastors)) + "'s own " + esc(d.heard) + " voice memo of this reading.</span></p>";
    }
    $("md-scripture").innerHTML = d.verses.map(function (v) { return '<blockquote class="md-verse"><b>' + N.refHTML(v.ref) + "</b><p>" + esc(v.text) + "</p><small>" + esc(N.translation) + "</small></blockquote>"; }).join("");
    $("md-paras").innerHTML = d.paras.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
    $("md-prayer").textContent = d.prayer;
    $("md-by").textContent = "From " + N.speaker(d, c.pastors);
  }
  /* A day not out yet is plain text the same size as the button beside it, never a faded button. */
  function soon(word, small) { return '<p class="md-soon"><b>' + esc(word) + "</b><small>" + esc(small) + "</small></p>"; }
  function paintBtns() {
    var s = NC.sermons[0], i = idx(), prevDay = days[i - 1], nextDay = days[i + 1];
    var canNext = nextDay && open(nextDay);
    $("md-btns").innerHTML =
      '<div class="md-two">' + (prevDay ? '<button type="button" class="m-btn" data-md-step="-1" aria-label="' + esc("Yesterday: " + N.dateLong(prevDay.date)) + '">' + GM.icon("back") + "Yesterday</button>" : soon("Yesterday", "This week starts Monday")) +
        (canNext ? '<button type="button" class="m-btn" data-md-step="1" aria-label="' + esc("Tomorrow: " + N.dateLong(nextDay.date)) + '">Tomorrow ' + GM.icon("arrow") + "</button>" : nextDay ? soon("Tomorrow", "Arrives at 6 AM") : soon("Tomorrow", "A new week starts Monday")) + "</div>" +
      '<a class="m-btn m-btn--primary" href="' + esc(GM.url("member-notes.html", { id: s.id })) + '">' + GM.icon("note") + "Read Sunday's Notes</a>" +
      '<button type="button" class="m-btn" id="md-share" aria-expanded="' + shareOpen + '" aria-controls="md-share-note">' + GM.icon("send") + "Share This Reading</button>" +
      '<p class="m-note md-share" id="md-share-note" role="status"' + (shareOpen ? "" : " hidden") + ">" + GM.icon("info") + "<span>Demo only. Nothing was sent. On a real church app, this opens your phone's own share sheet with a link to this reading.</span></p>";
  }
  /* Email is a choice for every morning, so it sits quietly under the reading, next to where it is changed. */
  function paintEmail() {
    $("md-email-row").innerHTML = '<button type="button" class="m-btn" id="md-email" aria-pressed="' + emailOn + '">' + GM.icon("mail") + "Email me each morning: " + (emailOn ? "On" : "Off") + "</button>" +
      '<a class="m-link" href="' + esc(GM.url("member-home.html")) + '#mh-profile">Change It in My Profile</a>';
  }
  function go(d) { pick = d; listenOpen = false; paintDays(); paintReading(); paintBtns(); }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-md-day]");
    if (b && !b.disabled) { go(days.filter(function (d) { return d.date === b.getAttribute("data-md-day"); })[0]); var nb = document.querySelector('[data-md-day="' + pick.date + '"]'); if (nb) nb.focus(); return; }
    var st = e.target.closest("[data-md-step]");
    if (st) { var d2 = days[idx() + +st.getAttribute("data-md-step")]; if (d2 && open(d2)) { go(d2); var sb = document.querySelector('[data-md-step="' + st.getAttribute("data-md-step") + '"]'); if (sb) sb.focus(); else { $("md-title").setAttribute("tabindex", "-1"); $("md-title").focus(); } } return; }
    if (e.target.closest("#md-listen-btn")) { listenOpen = !listenOpen; paintReading(); $("md-listen-btn").focus(); return; }
    if (e.target.closest("#md-share")) { shareOpen = !shareOpen; paintBtns(); $("md-share").focus(); return; }
    if (e.target.closest("#md-email")) { emailOn = !emailOn; paintEmail(); $("md-email").focus(); GM.toast("Demo only. Nothing was changed."); }
  });
  paintDays(); paintReading(); paintBtns(); paintEmail();
  mxRead($("md-read"));
  $("md-note").innerHTML = GM.icon("shield") + "<span>A new devotional arrives each morning at 6. Email goes only to members who chose it.</span>";
  GM.setTour([
    { target: '[data-tour="mdev.days"]', title: "One reading each morning", text: "Today's is open; the next ones arrive at 6 AM." },
    { target: '[data-tour="mdev.reading"]', title: "A verse and a few paragraphs", text: "In the pastor's own words." },
    { target: '[data-tour="mdev.prayer"]', title: "A prayer for today", text: "One line to pray." }
  ]);
});
</script>
</body>
</html>
