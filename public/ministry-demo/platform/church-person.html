<script>(function(){var t="dark";try{var q=new URLSearchParams(location.search).get("theme");var s=localStorage.getItem("gm.theme");t=(q==="light"||q==="dark")?q:(s==="light"?"light":"dark");}catch(e){}document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;document.documentElement.style.backgroundColor=t==="light"?"#f6f4ef":"#0d0e10";})();</script>

<style>
  /* People only. Prefix: ps-. The list is the Genesis OS Deals pattern and one person is the
     Genesis OS full record (head card, numbered steps, the side card); these only arrange them. */
  .ps-back{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap}
  .ps-back .v2-page-actions{display:flex;flex-wrap:wrap;gap:8px;margin:0}
  .ps-page .v2-drawer-recommendation>small{text-transform:uppercase;letter-spacing:.1em}
  .ps-lockline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0}
  .ps-lockline span.v2-muted-copy{flex:1 1 220px}
  .ps-req .v2-evidence-row{color:var(--v2-text);font-size:13px;line-height:1.55}
  .ps-req h3{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .ps-tags{display:flex;flex-wrap:wrap;gap:6px}
  .ps-attach{display:grid;gap:12px;margin-top:12px}
  .ps-row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ps-gift-list{display:grid;gap:0;margin:0;padding:0;list-style:none}
  .ps-gift-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--v2-border)}
  .ps-gift-list li:last-child{border-bottom:0}
  .ps-gift-list b{color:var(--v2-text);font-size:13px}
  .ps-gift-list span{color:var(--v2-text-2);font-size:12px;line-height:1.5}
  .ps-gift-list em{font-style:normal;color:var(--v2-text-2);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ps-rem li>button{flex:none;padding:0;border:0;background:none;border-radius:50%;cursor:pointer;color:inherit}
  .ps-rem li>button .v2-rec-tick{display:grid}
  @media (max-width:860px){.ps-rem li>button{min-width:44px;min-height:44px;display:grid;place-items:center;margin:-12px 0 -12px -12px}}
  /* The side card is narrow, so the reminder and its date stack and the reminder text is never cut. */
  .ps-rem-form{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:end;margin-top:16px}
  .ps-thread-reason{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
  .ps-threads .v2-row-title>:is(b,span){white-space:normal;overflow:visible;text-overflow:clip}
  /* The record's main column is one track that never grows past its column, so no card slides under the side cards.
     Thread rows use a record-width layout: title over who can see it, the status and Open in Care Inbox on the right. */
  .ps-page{container-type:inline-size}
  .ps-page .v2-rec-main{grid-template-columns:minmax(0,1fr)}
  .ps-threads .v2-attention-row{grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 14px}
  .ps-threads .v2-attention-row>.v2-row-title{grid-column:1;grid-row:1}
  .ps-threads .v2-attention-row>.v2-row-reason{grid-column:1;grid-row:2}
  .ps-threads .v2-attention-row>.v2-badge{grid-column:2;grid-row:1;justify-self:end}
  .ps-threads .v2-attention-row>.v2-row-action{grid-column:2;grid-row:2;display:block;justify-self:end;text-align:right;white-space:nowrap}
  /* A narrow page (the Hope dock open, or a small window) stacks the side cards under the record. */
  @container (max-width:720px){.ps-page .v2-rec-layout{grid-template-columns:minmax(0,1fr)}.ps-page .v2-rec-side{position:static}}
  .ps-rem-form .v2-button{grid-column:1/-1;justify-self:start}
  .ps-side-card p.v2-muted-copy{margin:4px 0 12px}
  .ps-side-card .ps-row-actions{margin-top:12px}
  .ps-foot{display:flex;align-items:flex-start;gap:10px;margin:0;color:var(--v2-fine,var(--v2-muted));font-size:12px;line-height:1.6}
  .ps-foot svg{flex:none;margin-top:2px;color:var(--v2-positive)}
  .ps-page a.v2-mobile-deal-row{color:inherit;text-decoration:none}
  .ps-empty{padding:28px 12px;text-align:center;color:var(--v2-muted);font-size:13px}
  .ps-page .v2-deal-table .v2-primary-cell>span{white-space:normal;overflow:visible;text-overflow:clip}
  /* The whole name cell is the target, not just the name. */
  .ps-page .v2-primary-cell>.v2-deal-row-link{display:flex}
</style>

<script>

    { at: "2026-11-19T10:12", who: "s-care",  action: "Opened",  what: "Person page for Sarah N.", where: "People", item: "p-sarah" },

    { at: "2026-11-18T08:24", who: "s-care",  action: "Opened",  what: "Prayer request from Sarah N.", where: "Care Inbox", item: "pr-01" },
    { at: "2026-11-18T08:20", who: "s-owen",  action: "Opened",  what: "Prayer request from Sarah N.", where: "Care Inbox", item: "pr-01" },

  /* Follow-up reminders. Guests also get one from their guest record. */
  var REMINDERS = {
    "p-sarah": [
      { text: "Call Sarah about her mom, as promised", brief: "a call about her mom", due: "2026-11-19", time: "7:00 PM", owner: "s-care", from: "Thread: Thank you for praying" },
      { text: "Check in after Sunday", due: "2026-11-23", owner: "s-care", from: "Pastor note" },

    ],

    "p-caleb":  [{ text: "Send a card to Caleb's grandmother", due: "2026-11-20", owner: "s-care", from: "Prayer request" }],
    "p-lucia":  [{ text: "Offer Lucia two times to meet next week", brief: "offer two times to meet", due: "2026-11-19", owner: "s-lead", from: "Thread: Time with a pastor" }],
    "p-kwame":  [{ text: "Introduce Kwame to the setup team", due: "2026-11-20", owner: "s-jun", from: "Thread: Joining the setup team" }],
    "p-fatima": [{ text: "Meal team drop-off for the new baby", brief: "a meal", due: "2026-11-19", time: "5:30 PM", owner: "s-care", from: "Prayer request" }],
    "p-naomi":  [{ text: "Send-off card before the January move", brief: "a send-off card", due: "2026-12-14", owner: "s-lead", from: "Prayer request" }]
  };
  /* Private pastor notes. Pastors only. */
  var NOTES = {
    "p-sarah": [{ by: "s-lead", at: "2026-08-12T18:00", text: "Got the teaching job she prayed about in August. Ask how the school year is going." }],
    "p-peter": [{ by: "s-care", at: "2026-11-18T09:20", text: "Connected with a counselor and has a plan for this week. Check in Monday morning." }],
    "p-grace": [{ by: "s-care", at: "2026-11-09T12:00", text: "Prefers a phone call. New to the city this year after losing her husband. Go gently." }],
    "p-lucia": [{ by: "s-lead", at: "2026-11-18T09:35", text: "Asked to talk about something at home. Offer a time this week with either pastor." }]
  };
  /* How long-time people first found the church, from the guest path. */
  var JOURNEY = {
    "p-sarah": { source: "Plan a Visit form", arrived: "2024-03-03", steps: [
      { stage: "new", at: "2024-03-03", text: "Planned a visit on the website" },
      { stage: "welcomed", at: "2024-03-04", text: "Welcome note from Nadia K." },
      { stage: "visited", at: "2024-03-10", text: "First Sunday, second gathering" },
      { stage: "start-here", at: "2024-04-07", text: "Came to Start Here" },
      { stage: "group", at: "2024-05-14", text: "Joined the New Parents Group" },
      { stage: "serving", at: "2024-09-08", text: "Joined Coffee and Hospitality" } ] },
    "p-kwame": { source: "Connect card", arrived: "2023-02-19", steps: [
      { stage: "new", at: "2023-02-19", text: "Filled a connect card" },
      { stage: "welcomed", at: "2023-02-20", text: "Welcome call from Hector M." },
      { stage: "visited", at: "2023-02-26", text: "Came back the next Sunday" },
      { stage: "start-here", at: "2023-04-02", text: "Came to Start Here" },
      { stage: "group", at: "2023-05-06", text: "Joined Men's Breakfast" } ] }
  };
  /* Older prayer forms that never attached themselves. A pastor attaches one only when the person asks. */
  var OLDER = [
    { id: "old-1", received: "2026-05-17T20:14", topic: "Family", form: "Website prayer form", typed: "s****@example.com" },
    { id: "old-2", received: "2026-03-02T08:41", topic: "Health", form: "Website prayer form", typed: "sarah****@example.com" },
    { id: "old-3", received: "2025-12-14T19:55", topic: "Thanksgiving", form: "Paper card, typed in", typed: "No email given" }
  ];

  var D = ctx.data, esc = GM.esc, fmt = GM.fmt, c = ctx.church, viewer = ctx.viewer, HOPE = GM.assistant.name, ic = GM.v2Icon;
  var $ = function (id) { return document.getElementById(id); };
  var page = $("ps-page");
  var local = {};
  function L(pid) { return local[pid] || (local[pid] = { reminders: [], notes: [], attached: [], done: {} }); }
  /* An entry the shared record already holds is never listed twice. */
  var accessKey = function (a) { return a.at + "|" + a.who + "|" + a.action; }, inShared = {};
  D.access.forEach(function (a) { inShared[accessKey(a)] = true; });
  var accessAll = D.access.map(function (a) { var o = {}; for (var k in a) o[k] = a[k]; o.item = o.item || ACCESS_ITEM[a.at + "|" + a.who] || null; return o; }).concat(EXTRA_ACCESS.filter(function (a) { return !inShared[accessKey(a)]; }));
  var waitingIds = {}; GM.waitingCare().forEach(function (w) { waitingIds[w.personId] = true; });

  /* ---------- Helpers ---------- */
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  function norm(s) { s = String(s || "").toLowerCase(); try { s = s.normalize("NFD").replace(/[̀-ͯ]/g, ""); } catch (e) {} return s; }
  function monthYear(s) { var d = GM.parseDate(s); return MONTHS[d.getMonth()] + " " + d.getFullYear(); }
  function statusLabel(p) { return p.status === "member" ? "Member" : p.status === "regular" ? "Regular" : "Guest"; }
  function attendsLabel(p) { return p.attends === "in person" ? "In person" : p.attends === "online" ? "Online" : "Exploring"; }
  /* Shared sample people are shown under every church, so "since" never runs earlier than the church itself. */
  function sinceDate(p) { var d = GM.parseDate(p.since); if (d.getFullYear() < c.founded) d = new Date(c.founded, d.getMonth(), d.getDate()); return d; }
  function sinceLine(p) { return p.status === "guest" ? "Guest, first contact " + fmt.date(p.since) : statusLabel(p) + " since " + monthYear(sinceDate(p)); }
  function shepherdOf(p) { var g = GM.guestByPerson(p.id); return p.shepherd ? GM.staff(p.shepherd) : g ? GM.staff(g.owner) : null; }
  function reminders(p) {
    var g = GM.guestByPerson(p.id), list = (REMINDERS[p.id] || []).slice();
    if (g && g.next && g.due) list.unshift({ text: g.next, due: g.due, owner: g.owner, from: "Guest record" });
    return list.concat(L(p.id).reminders).map(function (r) { r.key = r.text + "|" + r.due; return r; });
  }
  function openReminders(p) { var lc = L(p.id); return reminders(p).filter(function (r) { return !lc.done[r.key]; }).sort(function (a, b) { return GM.parseDate(a.due) - GM.parseDate(b.due); }); }
  function dueText(r) { var d = fmt.due(r.due); return { text: d.text.charAt(0).toUpperCase() + d.text.slice(1) + (r.time && d.days === 0 ? ", " + r.time : ""), tone: d.tone, days: d.days }; }
  function attendsBadge(p) { return GM.pill(attendsLabel(p), p.attends === "online" ? "info" : "neutral"); }
  function pulse(label, value, note) { return '<div class="v2-pulse-item"><small>' + esc(label) + '</small><b class="v2-serif-number">' + esc(value) + '</b><span data-detail-min="standard">' + esc(note) + "</span></div>"; }
  function step(n, eyebrow, title, body, tour, id) {
    return '<section class="v2-card v2-rec-step"' + (tour ? ' data-tour="' + tour + '"' : "") + (id ? ' id="' + id + '"' : "") + '><div class="v2-rec-step-head"><span class="v2-rec-step-n" aria-hidden="true">' + n + '</span><div><div class="v2-eyebrow">' + esc(eyebrow) + "</div><h2>" + esc(title) + '</h2></div></div><div class="v2-rec-step-body">' + body + "</div></section>";
  }
  /* Lowercase the first letter only, so a time keeps its AM and PM. */
  function lc1(t) { t = String(t); return t.charAt(0).toLowerCase() + t.slice(1); }
  function fact(label, value) { return '<div class="v2-fact"><small>' + esc(label) + "</small><b>" + esc(value) + "</b></div>"; }

  var id = ctx.params.get("id");
  if (id && GM.person(id)) paintRecord(GM.person(id)); else paintList();

  /* =====================================================================
     The People list: one record per person (the Deals pattern)
     ===================================================================== */
  function paintList() {
    var people = D.people.map(function (x) { return GM.person(x.id); }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    var state = { q: "", filter: "", sort: "name" };
    var members = people.filter(function (p) { return p.status === "member"; }).length;
    var regulars = people.filter(function (p) { return p.status === "regular"; }).length;
    var guests = people.filter(function (p) { return p.status === "guest"; }).length;

    /* The person to check on first: the earliest open reminder outside the guest path. */
    var pick = null, pickR = null;
    people.filter(function (p) { return p.status !== "guest"; }).forEach(function (p) {
      var r = openReminders(p)[0];
      if (r && (!pickR || GM.parseDate(r.due) < GM.parseDate(pickR.due) || (r.due === pickR.due && p.id === "p-sarah"))) { pick = p; pickR = r; }
    });

    page.classList.add("v2-deals-page");
    page.innerHTML =
      '<header class="v2-page-head"><div><div class="v2-eyebrow">People</div><h1>Everyone</h1><p>' + people.length + " of " + D.peopleTotals.records + " people shown in this preview, one record each. Adults only, and nobody sees a directory.</p></div>" +
        '<div class="v2-page-actions"><button class="v2-button v2-button-quiet" type="button" data-gm-action="open-hope" data-gm-prompt="Who should I check on this week?">Ask ' + esc(HOPE) + '</button><a class="v2-button v2-button-quiet" href="church-access.html">Access Record</a></div></header>' +
      '<section class="v2-pulse v2-deal-pulse" aria-label="People summary" data-tour="person.pulse">' +
        pulse("Members", D.peopleTotals.members, members + " of them in this sample list") +
        pulse("Regulars", D.peopleTotals.regulars, "Here most weeks, not members yet") +
        pulse("On the guest path", D.guests.length, "Each one has an owner in Guests") + "</section>" +
      (pick ? '<section class="v2-card v2-next-move v2-deal-next" aria-labelledby="ps-next-title" data-tour="person.next"><div><div class="v2-eyebrow">Person to check on</div><h2 class="v2-serif-headline" id="ps-next-title">' + esc(pick.name) + "</h2><h3>" + esc(sinceLine(pick) + " · " + attendsLabel(pick)) + "</h3>" +
        '<div class="v2-next-meta">' + GM.pill(dueText(pickR).text, dueText(pickR).tone === "neutral" ? "neutral" : dueText(pickR).tone) + GM.pill(GM.staff(pickR.owner).name, "neutral") + (waitingIds[pick.id] ? GM.pill("Care waiting", "warning") : "") + "</div>" +
        '<p class="v2-next-reason">' + esc(pickR.text) + '<span class="v2-next-why">Why now: ' + esc("From " + pickR.from.charAt(0).toLowerCase() + pickR.from.slice(1) + ". The reminder is due today, and the person page holds everything you need for the call.") + "</span></p></div>" +
        '<div class="v2-next-actions"><a class="v2-button v2-button-primary" href="church-person.html?id=' + esc(pick.id) + '">' + ic("arrow") + "Open " + esc(pick.first) + "&#39;s Page</a>" +
        '<a class="v2-button v2-button-quiet" href="church-care.html?view=messages">Open Care Inbox</a></div></section>' : "") +
      '<div class="v2-toolbar v2-deal-toolbar" role="toolbar" aria-label="People tools">' +
        '<label class="v2-search"><span class="sr-only">Search people by name</span><input class="v2-input" id="ps-search" type="search" placeholder="Search by name&hellip;" autocomplete="off"></label>' +
        '<select class="v2-select v2-nselect" id="ps-filter" aria-label="Show"><option value="">Everyone</option><option value="member">Members</option><option value="regular">Regulars</option><option value="guest">Guests</option><option value="online">Online</option><option value="care">Care Waiting</option></select>' +
        '<select class="v2-select v2-nselect" id="ps-sort" aria-label="Sort people"><option value="name">Name</option><option value="newest">Newest First</option><option value="due">Reminder Due</option></select></div>' +
      '<div id="ps-body" data-tour="person.list"></div>' +
      '<section class="v2-section" aria-label="How People is protected"><p class="ps-foot">' + ic("shield") + "<span>Adults only: every member app account confirmed 18 or older at first sign-in. There is no directory, so members never see each other. Opening a person page is written to the access record.</span></p></section>";

    function body() {
      var list = people.filter(function (p) {
        if (state.filter === "online" && p.attends !== "online") return false;
        if (state.filter === "care" && !waitingIds[p.id]) return false;
        if (state.filter && state.filter !== "online" && state.filter !== "care" && p.status !== state.filter) return false;
        return !state.q || norm(p.name).indexOf(state.q) >= 0;
      });
      if (state.sort === "newest") list.sort(function (a, b) { return GM.parseDate(b.since) - GM.parseDate(a.since); });
      if (state.sort === "due") list.sort(function (a, b) { var ra = openReminders(a)[0], rb = openReminders(b)[0]; return (ra ? GM.parseDate(ra.due) : 9e15) - (rb ? GM.parseDate(rb.due) : 9e15); });
      function careCell(p) {
        var r = openReminders(p)[0], d = r && fmt.due(r.due);
        if (waitingIds[p.id]) return GM.pill("Care waiting", "warning");
        if (d && d.days != null && d.days <= 0) return GM.pill(d.tone === "danger" ? "Reminder overdue" : "Reminder today", d.tone === "danger" ? "danger" : "priority");
        if (r) return '<span class="v2-deal-why is-calm">' + esc(dueText(r).text) + "</span>";
        return '<span class="v2-deal-why is-calm">Nothing waiting</span>';
      }
      var rows = list.map(function (p) {
        var sh = shepherdOf(p);
        return '<tr><td class="v2-primary-cell"><a class="v2-deal-row-link" href="church-person.html?id=' + esc(p.id) + '"><b>' + esc(p.name) + "</b></a><span>" + esc(sinceLine(p)) + "</span></td><td>" + attendsBadge(p) + "</td><td>" + careCell(p) + '</td><td class="v2-deal-owner-cell">' + esc(sh ? sh.name : "Not set") + "</td></tr>";
      }).join("");
      var mobile = list.map(function (p) {
        var sh = shepherdOf(p);

  /* =====================================================================
     One person: the Genesis OS full record
     ===================================================================== */
  function paintRecord(p) {
    var first = p.first, g = GM.guestByPerson(p.id), lc = L(p.id), sh = shepherdOf(p);
    page.classList.add("v2-record-page");

    function head() {
      var next = openReminders(p)[0];
      var rec = next
        ? '<div class="v2-drawer-recommendation"><small>Next step</small><b>' + esc(next.text) + '</b><span class="v2-recommendation-reason">' + esc(dueText(next).text + " · " + GM.staff(next.owner).name + " · from " + next.from.charAt(0).toLowerCase() + next.from.slice(1)) + "</span>" +
          '<div class="v2-drawer-actions"><button class="v2-button v2-button-primary" type="button" data-gm-action="toast" data-gm-toast="A private thread with ' + esc(first) + ' would open in the Care Inbox, owned by you. Preview only.">' + ic("message") + "Send a Message</button>" +
          '<button class="v2-button" type="button" data-ps="done-next" data-key="' + esc(next.key) + '">' + ic("check") + "Mark Done</button>" +

      return '<section class="v2-card v2-next-move v2-rec-head v2-full-record-head" aria-labelledby="ps-name" data-tour="person.card"><div><div class="v2-eyebrow">' + esc(p.status === "guest" ? "Guest record and person page" : "Person page") + '</div><h1 class="v2-rec-name" id="ps-name">' + esc(p.name) + "</h1>" +
        '<p class="v2-rec-where">' + esc(sinceLine(p) + " · " + attendsLabel(p) + (p.attends === "in person" ? ", " + c.times : p.attends === "online" ? ", watches the livestream" : "") + " · Prefers " + (p.contact || "Email").toLowerCase()) + "</p>" +
        '<div class="v2-next-meta">' + GM.pill(statusLabel(p), p.status === "member" ? "gold" : "neutral") + attendsBadge(p) + (p.adultConfirmed ? GM.pill("Adult confirmed", "positive") : GM.pill("No member app yet", "neutral")) + (waitingIds[p.id] ? GM.pill("Care waiting", "warning") : "") + GM.pill("This open is recorded", "neutral") + "</div></div>" +
        '<div class="v2-next-actions" id="ps-headnext">' + rec + "</div></section>";
    }

    /* 1. Who this is */
    function whoBody() {
      var arrived = (JOURNEY[p.id] && JOURNEY[p.id].arrived) || (g && g.arrived) || sinceDate(p);

        ["Cared for by", sh ? sh.name : "Not set"], ["Household", p.household || "Not shared"]];
      var res = null; D.gifts.results.forEach(function (r) { if (r.personId === p.id) res = r; });

          '<div class="ps-tags" style="margin-top:10px">' + (res.wantsToTalk ? GM.pill("Wants to talk about serving", "gold") : "") + GM.pill(res.servingNow ? "Serving now" : "Not serving yet", "neutral") + "</div>" +
          '<p class="v2-muted-copy" style="margin-top:8px">Gifts to explore, never a verdict. The score is plain arithmetic from ' + esc(first) + "'s own answers. " + esc(HOPE) + ' never sets a score. <a class="gm-link" href="church-gifts.html">Gifts of Our Church</a></p></section>';
      } else {

      }

      return '<p class="ps-lockline">' + GM.lock("staff", "Staff and pastors") + '<span class="v2-muted-copy">The contact card. Staff and pastors can see it.</span></p>' +

        '<section class="v2-record-section"><h3>Serving</h3>' + tags(p.serving, "Not on a team yet.") + "</section>" +
        '<section class="v2-record-section"><h3>Groups</h3>' + tags(p.groups, "Not in a group yet.") + "</section>" + gifts;

    /* 2. Prayer and conversations */
    function careBody() {

          (String(r.id).indexOf("old-") === 0 ? "" : '<p class="v2-muted-copy" style="margin-top:6px"><a class="gm-link" href="church-care.html?id=' + esc(r.id) + '">Open in Care Inbox</a></p>') + "</section>";
      }).join("") || '<div class="v2-state-inline">No prayer requests from ' + esc(first) + ".</div>";
      var older = OLDER.filter(function (o) { return !lc.attached.some(function (a) { return a.id === o.id; }); });
      var attach = '<section class="v2-record-section"><h3>Older requests</h3><p class="v2-muted-copy">Older requests never attach themselves. The email on an old form was typed and never checked, so a pastor attaches one only when ' + esc(first) + " asks.</p>" +
        '<div class="ps-row-actions" style="margin-top:10px"><button class="v2-button" type="button" data-ps="attach-open" aria-expanded="false" aria-controls="ps-attach">' + ic("plus") + "Attach an Older Request</button></div>" +
        '<form class="ps-attach" id="ps-attach" hidden novalidate><label class="v2-field"><span>Which request did ' + esc(first) + " ask about?</span>" +
        '<select class="v2-select v2-nselect" id="ps-older">' + (older.length ? older.map(function (o) { return '<option value="' + o.id + '">' + esc(o.form + ", " + fmt.dateLong(o.received) + ". Topic: " + o.topic + ". Typed email: " + o.typed) + "</option>"; }).join("") : '<option value="">No Older Requests Left to Attach</option>') + "</select></label>" +
        '<label class="gm-check"><input type="checkbox" id="ps-asked"> ' + esc(first) + " asked me to attach this</label>" +
        '<div class="ps-row-actions"><button class="v2-button" type="submit">Attach Request</button><button class="v2-button v2-button-quiet" type="button" data-ps="attach-cancel">Cancel</button></div></form></section>';
      var threads = (p.threads || []).map(GM.thread).filter(Boolean);
      var tRows = threads.length ? '<div class="v2-card v2-attention-list">' + threads.map(function (t) {
        var last = t.messages[t.messages.length - 1];
        var st = { "waiting-on-us": ["Waiting on us", "warning"], "waiting-on-them": ["Their turn", "neutral"], closed: ["Closed", "neutral"], archived: ["Archived", "neutral"] }[t.status] || [t.status, "neutral"];
        return '<a class="v2-attention-row" href="church-care.html?id=' + esc(t.id) + '"><span class="v2-row-title"><b>' + esc(t.subject) + "</b><span>" + esc(GM.fmt.plural(t.messages.length, "message") + " · last " + fmt.when(last.at).replace(/^(Today|Yesterday)/, function (w) { return w.toLowerCase(); })) + "</span></span>" +
          '<span class="v2-row-reason ps-thread-reason">' + (t.kind === "private" ? GM.lock("pastors") : GM.lock("staff", "Staff and pastors")) + "<span>" + esc(GM.staff(t.owner).name) + "</span></span>" + GM.pill(st[0], st[1]) + '<span class="v2-row-action">Open in Care Inbox <span aria-hidden="true">&rarr;</span></span></a>';
      }).join("") + "</div>" : '<div class="v2-state-inline">No message threads with ' + esc(first) + " yet.</div>";
      return '<p class="ps-lockline">' + GM.lock("prayer") + '<span class="v2-muted-copy">Prayer history is seen by pastors and the prayer team. Staff and website admins never see this part.</span></p>' +
        list + attach + '<section class="v2-record-section ps-threads"><h3>Message threads</h3>' + tRows + "</section>";

    /* 3. Private pastor notes */
    function notesBody() {
      var notes = (p.notes ? [{ by: p.shepherd || "s-care", at: "2026-11-18T13:05", text: p.notes }] : []).concat(NOTES[p.id] || [], lc.notes).sort(function (a, b) { return GM.parseDate(b.at) - GM.parseDate(a.at); });

        '<div class="v2-rec-activity">' + (notes.length ? notes.map(function (n) { return '<div class="v2-activity-row">' + esc(n.text) + "<small>" + esc(GM.staff(n.by).name + " · " + fmt.when(n.at)) + "</small></div>"; }).join("") : '<p class="v2-muted-copy">No notes yet.</p>') + "</div>" +

    /* 5. Reminders, on the side */
    function remindersCard() {

            "<span>" + esc(r.text) + (done ? '<span class="sr-only">, done</span>' : "") + "<small>" + esc(d.text + " · " + GM.staff(r.owner).name + " · from " + r.from.charAt(0).toLowerCase() + r.from.slice(1)) + "</small></span></li>";
        }).join("") + "</ol>" : '<p class="v2-muted-copy">No reminders. Add one so nobody is forgotten.</p>') +
        '<form class="ps-rem-form" id="ps-rem-form" novalidate><label class="v2-field"><span>New reminder</span><input class="v2-input" id="ps-rem-text" placeholder="For example: Check in next week" autocomplete="off"></label>' +

    }
    /* The new reminder's date starts on the day after the sample's today (Thursday, November 19). */
    function sampleTomorrow() { var d = new Date(+GM.now + 86400000); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
    function opensCard() {

      var opens = accessAll.filter(function (a) { return a.who !== "system" && (ids[a.item] || a.what.indexOf(p.name) >= 0); }).sort(function (a, b) { return GM.parseDate(b.at) - GM.parseDate(a.at); }).slice(0, 4);

        '<p class="v2-muted-copy" style="margin:12px 0 0"><a class="gm-link" href="church-access.html">Open the Access Record</a></p></section>';
    }

    var tourSet = false;
    paint();

    page.addEventListener("click", function (e) {
      var b = e.target.closest("[data-ps]"); if (!b) return;

      else if (act === "attach-cancel") { $("ps-attach").hidden = true; }
      else if (act === "done" || act === "done-next") {
        var key = b.getAttribute("data-key"); lc.done[key] = !lc.done[key]; paint();
        GM.toast(lc.done[key] ? "Marked done. Preview only." : "Marked not done. Preview only.");
      }
    });
    page.addEventListener("submit", function (e) {
      e.preventDefault();
      if (e.target.id === "ps-attach") {
        var sel = $("ps-older"), asked = $("ps-asked");
        if (!sel.value) return;
        if (!asked.checked) { asked.focus(); GM.toast("Attach only when " + first + " asks. Tick the box to confirm."); return; }
        var o = OLDER.filter(function (x) { return x.id === sel.value; })[0];
        lc.attached.push({ id: o.id, received: o.received, topic: o.topic, status: "attached", visibility: "prayer", attachedNote: o.form + ", " + fmt.dateLong(o.received) + ". Attached by " + viewer.name + " just now, at " + first + "'s request." });
        paint(); GM.toast("Attached at " + first + "'s request and written to the access record. Preview only.");
      } else if (e.target.id === "ps-note-form") {
        var t = $("ps-note");
        if (!t.value.trim()) { t.focus(); GM.toast("Write the note first."); return; }
        lc.notes.push({ by: viewer.id, at: GM_DATA.now, text: t.value.trim() });
        paint(); GM.toast("Note saved for pastors only. Preview only.");
      } else if (e.target.id === "ps-rem-form") {
        var rt = $("ps-rem-text"), rd = $("ps-rem-due");
        if (!rt.value.trim()) { rt.focus(); GM.toast("Write the reminder first."); return; }
        lc.reminders.push({ text: rt.value.trim(), due: rd.value || "2026-11-23", owner: viewer.id, from: "Added by you" });
        paint(); GM.toast("Reminder added. It shows on Today when it is due. Preview only.");
      }
    });

    var next = openReminders(p)[0];
    /* When, the way a pastor says it: "tonight at 7", "today at 10 AM", "due Mon". */
    function whenSaid(r) {
      if (fmt.due(r.due).days !== 0) return ", " + lc1(dueText(r).text);
      if (!r.time) return ", today";
      var h = parseInt(r.time, 10), pm = /PM/.test(r.time);
      return pm && h >= 5 && h < 12 ? " tonight at " + r.time.replace(/:00| PM/g, "") : " today at " + r.time.replace(":00", "");
    }
    /* About 80 characters, three lines at 1440, as Genesis OS writes its greeting: what is next for this person,
       or, when the step is long, just when it is due (the step itself is the first thing on the page). */
    function nextLine(r) {
      var said = "Next for " + first + ": " + (r.brief || lc1(r.text)) + whenSaid(r) + ".";
      return said.length <= 50 ? said : first + "'s next step is " + lc1(dueText(r).text) + ".";
    }
    GM.hope.setBriefing({
      line: GM.greeting() + ", {name}. " + (next
        ? nextLine(next)
        : p.name + " is a " + statusLabel(p).toLowerCase() + " who attends " + attendsLabel(p).toLowerCase() + "."),
      chips: [{ label: "Send a Message", action: function () { GM.hope.close(); GM.toast("A private thread with " + first + " would open in the Care Inbox, owned by you. Preview only."); }, primary: true }, { label: "Open Care Inbox", href: "church-care.html" }, { label: "Back to People", href: "church-person.html" }]
    });
    GM.hope.addAnswers([{ match: /know|call|before/i, answer: function () { var n = openReminders(p)[0]; return first + " prefers " + (p.contact || "email").toLowerCase() + "." + (n ? " The open reminder is: " + n.text + ", " + lc1(dueText(n).text) + ", owned by " + GM.staff(n.owner).name + "." : "") + " I do not read prayer words or pastor notes aloud; they stay on the page for the people allowed to see them."; } }]);
    GM.setTour([
      { target: '[data-tour="person.card"]', title: "One record per person", text: "Name, how they attend, how they like to be reached, and the next step with its owner. Opening this page is written to the access record." },
      { target: '[data-tour="person.prayer"]', title: "Prayer history, behind a lock", text: "Only pastors and the prayer team see it. Older requests never attach themselves; a pastor attaches one only when the person asks." },
      { target: '[data-tour="person.notes"]', title: "Private pastor notes", text: "For pastors only. Never shown to the person, staff or the prayer team, and archived instead of deleted." },
      { target: '[data-tour="person.journey"]', title: "The guest journey that led here", text: "From the first Plan a Visit form or {assistant.name} conversation to a group and a team." },
      { target: '[data-tour="person.reminders"]', title: "Nobody is forgotten", text: "Follow-up reminders with an owner and a date. Due today shows on Today." },
      { target: '[data-tour="person.requests"]', title: "Their information belongs to them", text: "A person can ask for a copy or for removal. Removal waits for the lead pastor, and nothing is erased by accident." }
    ]);
    tourSet = true;
  }
});
</script>
</body>
</html>
