<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">

<script>(function(){var t="dark";try{var q=new URLSearchParams(location.search).get("theme");var s=localStorage.getItem("gm.theme");t=(q==="light"||q==="dark")?q:(s==="light"?"light":"dark");}catch(e){}document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;document.documentElement.style.backgroundColor=t==="light"?"#f6f4ef":"#0d0e10";})();</script>
<link rel="icon" href="shared/brand/favicon.svg" type="image/svg+xml">
<link rel="preload" href="shared/fonts/satoshi-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="shared/fonts/gambetta-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="shared/genesis.css">
<link rel="stylesheet" href="shared/member.css">
<style>
  /* Member notes only. Prefix: mn-. Church tokens (--m-*) only inside the phone. */
  .m-app .mn-meta{margin:4px 0 0;color:var(--m-muted);font-size:14px}
  .m-app .mn-verse{margin:0;padding:14px 16px;border:1px solid var(--m-line);border-left:3px solid var(--m-accent-ink);border-radius:0 var(--m-radius-lg) var(--m-radius-lg) 0;background:var(--m-surface)}
  .mn-verse b{display:block;color:var(--m-accent-ink);font-size:14px}
  .m-app .mn-verse p{margin:6px 0;font-size:calc(18px * var(--mx-read,1));line-height:1.6}
  .mn-verse small{color:var(--m-muted);font-size:13px}
  .m-app .mn-points{margin:0;padding:0;list-style:none;display:grid;gap:14px;counter-reset:mn}
  .m-app .mn-points li{position:relative;padding-left:36px;font-size:calc(17px * var(--mx-read,1));line-height:1.55;counter-increment:mn}
  .mn-points li::before{content:counter(mn);position:absolute;left:0;top:1px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--m-accent-soft);color:var(--m-text);font-size:13px;font-weight:700}
  .m-app .mn-qs{margin:0;padding:0;list-style:none}
  .m-app .mn-qs li{padding:14px 16px;border-top:1px solid var(--m-line);font-size:calc(17px * var(--mx-read,1));line-height:1.55}
  .mn-qs li:first-child{border-top:0}
  .m-app .mn-week{margin-top:14px;padding:12px 14px;border-left:3px solid var(--m-accent-ink);border-radius:0 var(--m-radius) var(--m-radius) 0;background:var(--m-surface-2);font-size:16px;line-height:1.55}
  .mn-week b{display:block;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--m-accent-ink)}
  .mn-btns{display:grid;gap:10px;margin-top:16px}
  .m-app .mn-btns .m-btn{min-height:48px;width:100%}
  /* "From the message": its own labelled block under the points, so it never reads as point 3. */
  .m-app .mn-deeper{margin:16px 0 0;padding:14px 0 0 36px;border-top:1px solid var(--m-line)}
  .m-app .mn-deeper b{display:block;margin-bottom:4px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--m-accent-ink)}
  .m-app .mn-deeper p{margin:0;color:var(--m-text);font-size:16px;line-height:1.6}
  .m-app .mn-sched{margin:0 0 14px}
  .m-app .mn-sched a{display:inline-flex;align-items:center;min-height:44px;color:var(--m-accent-ink);font-weight:700}
  .m-app .mn-novideo{margin:0;color:var(--m-muted);font-size:14.5px;line-height:1.5}
  /* Follow along on Sunday: one point at a time in large type, with a note that stays on this phone. */
  .m-app .mn-follow-go{margin-top:14px;width:100%;min-height:48px}
  .mn-follow[hidden]{display:none}
  .m-app .mn-follow-bar{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -18px 16px;padding:10px 18px;background:var(--m-surface);border-bottom:1px solid var(--m-line);font-size:15px;font-weight:700}
  .m-app .mn-follow-bar .m-btn{min-height:44px;padding:8px 14px;font-size:14.5px}
  .m-app .mn-follow-point{margin:0;font-size:calc(24px * var(--mx-read,1));line-height:1.4;font-weight:700}
  .m-app .mn-follow-where{display:grid;gap:2px;min-width:0}
  .m-app .mn-follow-where small{color:var(--m-muted);font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-app .mn-follow-verse p{font-size:calc(20px * var(--mx-read,1))}
  .m-app .mn-follow-qs{margin-bottom:6px}
  .m-app .mn-key{display:block;margin-bottom:4px;color:var(--m-muted);font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .m-app .mn-mine{display:block;margin-top:8px;padding:8px 12px;border-left:3px solid var(--m-line-strong);border-radius:0 var(--m-radius) var(--m-radius) 0;background:var(--m-surface-2);color:var(--m-text);font-size:15px;font-weight:400;line-height:1.5}
  .m-app .mn-mine b{display:block;color:var(--m-muted);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
  .m-app .mn-copy{display:grid;gap:10px;margin-top:16px}
  .m-app .mn-copy .m-btn{width:100%;min-height:48px}
  .m-app .mn-sunday{margin:8px 0 0}
  .m-app .mn-sunday .m-btn{width:100%;font-weight:600}
  /* One disabled look across the reader: a dashed outline in full-contrast type, never a faded button. */
  .m-app .mn-two .m-btn:disabled{opacity:1;border-style:dashed;cursor:default;color:var(--m-muted)}
  /* While following, the tab bar steps aside so the point and its two buttons fit, even on a phone on its side. */
  body.mn-following .m-tabbar{display:none!important}
  .m-app .mn-my{display:grid;gap:6px;margin-top:18px;font-size:15px;font-weight:700}
  .m-app .mn-my small{color:var(--m-muted);font-size:13.5px;font-weight:500}
  .m-app .mn-my .m-textarea{min-height:110px;font-size:17px;font-weight:400}
  .m-app .mn-help{margin:10px 0 0;font-size:14px}
  .m-app .mn-help a{display:inline-flex;align-items:center;min-height:44px;color:var(--m-accent-ink);font-weight:700}
  .m-app .mn-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
  .m-app .mn-two .m-btn{width:100%;min-height:48px}
  body.mn-following .mn-reader{display:none}
  /* Reading comfort, the same on the notes and the devotional reader (prefix mx-read): text size and,
     in the bright looks, Night Reading. Kept on this phone (localStorage), and the page reads fine without it. */
  .m-app .mx-read{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
  .m-app .mx-read .m-btn{min-height:44px;min-width:44px;padding:6px 12px;font-size:15px}
  .m-app .mx-read .m-btn[aria-pressed="true"]{border-color:var(--m-accent);box-shadow:inset 0 0 0 1.5px var(--m-accent)}
  .m-app.mx-night{--m-bg:#15161a!important;--m-surface:#1d1f24!important;--m-surface-2:#24262c!important;--m-surface-3:#2c2f36!important;--m-text:#ece8e1!important;--m-muted:#b9b3a9!important;--m-line:#373a41!important;--m-line-strong:#4c5059!important;--m-accent-ink:#e9d5a6!important;--m-accent-soft:rgba(233,213,166,.16)!important;color-scheme:dark!important}
  .mx-staged .gm-plan-label{font-size:12px}
  /* ==== Member stage. The same block sits on every member page (prefix mx-). ====
     Fold it into shared/member.css and shared/app.js when the foundation next touches them.
     1. Spacing. The shared reset body[data-side="member"] :where(h1,h2,h3,h4,p,ul,ol){margin:0}
        in genesis.css outranks single-class rules in member.css, so these restore them. */
  .m-app .m-h1{margin:6px 0 8px}
  .m-app p.m-section,.m-app ul.m-section{margin-top:26px}
  .m-app .m-checks{margin:16px 0 22px}
  .m-app .m-note-quiet{margin:14px 0 0}
  .m-app .m-powered{margin-top:32px}
  /* member.css sets .m-app a{color:inherit}, which outranks the colors of linked buttons and links. */
  .m-app a.m-link{color:var(--m-accent-ink)}
  .m-app a.m-btn--primary,.m-app a.m-card--accent{color:var(--m-on-accent)}
  /* Inside the phone only the church's focus ring shows, as member.css intends. */
  .m-app :focus-visible{box-shadow:none!important}
  .m-app .m-choice[aria-pressed="true"]:focus-visible{box-shadow:inset 0 0 0 1.5px var(--m-accent)!important}
  /* 2. The stage around the phone, in the Genesis OS shell: the sample strip, the brand
        block, real v2 controls, and beside the phone a page head and the screen list. */
  body.mx-staged{padding-top:44px}
  .mx-staged .m-stage{min-height:calc(100vh - 44px);background:var(--v2-bg)}
  .mx-staged .m-stagebar{min-height:64px;padding:10px 20px;gap:10px 12px;background:var(--v2-sidebar);border-bottom:1px solid var(--v2-border)}
  .mx-staged .m-stagebar .gm-preview-label{display:none}
  .mx-staged .m-stage-brand{gap:9px;margin-right:10px}
  .mx-staged .m-stage-brand b{font-size:15px;font-weight:700;line-height:1.15}
  .mx-staged .m-stage-brand small{font-size:11px;line-height:1.3}
  .mx-staged .m-stagebar .v2-button{min-height:40px;margin:0;font-size:12.5px}
  .mx-staged .m-stagebar .v2-icon-button{width:40px}
  .mx-staged .m-device{height:min(880px,calc(100vh - 160px));margin:24px auto 16px}
  @media (min-width:521px){.mx-staged .m-device>.m-app{min-height:0}}
  .mx-about,.mx-screens{display:none}
  /* From 700px the stage also shows what this screen protects and the member app's screens:
     under the phone (700 to 919px), beside it in one column (920 to 1179px), on both sides (1180px up). */
  @media (min-width:700px){
    .mx-staged .m-stage{display:grid;align-items:start;align-content:start}
    .mx-staged .m-stagebar{grid-column:1/-1}
    .mx-staged .m-caption{display:none}
    .mx-about{display:grid;gap:22px;align-content:start}
    .mx-screens{display:grid;gap:10px;padding:16px 10px 14px}
    .mx-about .v2-page-head{margin:0}
    .mx-about .v2-serif-title{margin:6px 0 10px;font-size:34px;line-height:1.12}
    .mx-about .v2-page-head p{font-size:14px;line-height:1.6;color:var(--v2-text-2)}
    .mx-card{display:grid;gap:14px;padding:20px 22px}
    .mx-card .gm-protect-list{grid-template-columns:1fr;gap:14px}
    .mx-card .gm-protect-list li{margin:0;padding:0 0 14px;border-right:0;border-bottom:1px solid var(--v2-border)}
    .mx-card .gm-protect-list li:last-child{padding-bottom:0;border-bottom:0}
    .mx-about .mx-land{justify-self:start}
    .mx-screens>.v2-eyebrow{padding:0 10px}
    .mx-screens .v2-rail-nav{padding:0}
    .mx-screens .v2-rail-nav .gm-nav-lock{display:inline-flex}
    .mx-screens .mx-fine{margin:4px 10px 0;color:var(--v2-muted);font-size:12px;line-height:1.5}
  }
  @media (min-width:700px) and (max-width:919px){
    .mx-staged .m-stage{grid-template-columns:minmax(0,1fr) minmax(0,440px) 236px minmax(0,1fr);column-gap:20px;padding-bottom:88px}
    .mx-staged .m-device{grid-column:2/4;grid-row:2}
    .mx-about{grid-column:2;grid-row:3;margin-top:12px}
    .mx-screens{grid-column:3;grid-row:3;margin-top:12px}
  }
  @media (min-width:920px) and (max-width:1179px){
    .mx-staged .m-stage{grid-template-columns:minmax(0,1fr) min(430px,100%) minmax(0,380px) minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:44px;padding-bottom:88px}
    .mx-staged .m-device{grid-column:2;grid-row:2/4}
    .mx-about{grid-column:3;grid-row:2;margin-top:44px}
    .mx-screens{grid-column:3;grid-row:3;margin-top:22px}
  }
  @media (min-width:1180px){
    .mx-staged .m-stage{grid-template-columns:minmax(0,1fr) min(430px,100%) minmax(0,1fr);column-gap:48px}
    .mx-staged .m-device{grid-column:2;grid-row:2}
    .mx-about{grid-column:1;grid-row:2;justify-self:end;width:min(360px,100%);margin-top:44px}
    .mx-screens{grid-column:3;grid-row:2;justify-self:start;width:min(236px,100%);margin-top:44px}
  }
  @media (max-width:860px){.mx-staged .m-stagebar .gm-menu{top:112px}}
  /* Below 1180px Take the Tour is an icon button (its name stays), so the stage bar never wraps. */
  @media (max-width:1179px){
    .mx-staged .m-stagebar .mx-tour span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    .mx-staged .m-stagebar .mx-tour{width:40px;padding:0}
  }
  @media (max-width:520px){
    .mx-staged .m-stagebar{min-height:0;padding:8px 12px;gap:6px}
    .mx-staged .m-stagebar .gm-plan a{padding:4px 8px}
    .mx-staged .m-device{height:auto;margin:0}
    .mx-staged .m-top{top:44px}
  }
  /* ==== end member stage ==== */
</style>
</head>

<script>
/* ==== Member stage. The same function sits on every member page (prefix mx-). ====
   Dresses the stage the shell draws around the phone in the Genesis OS shell: the real sample
   strip, the brand block, v2 buttons and Take the Tour, and on wide screens a page head with
   what this screen protects (left) and the member app's screens (right). The phone is untouched.
   o = { title (HTML with em.v2-accent-em), sub, protect: [[bold, line], ...], land: { href, label, icon, module } }
   land.module: the plan module of the screen it opens; outside the plan shown, the link carries the plan lock. */
function mxStage(o) {
  "use strict";
  var body = document.body, stage = document.querySelector(".m-stage");
  if (!stage || body.classList.contains("mx-staged")) return;
  var esc = GM.esc, c = GM.church, D = GM.data, here = location.pathname.split("/").pop() || "member-home.html";
  body.classList.add("mx-staged");
  body.insertAdjacentHTML("beforeend", GM.previewStripHTML());

  var bar = stage.querySelector(".m-stagebar");
  var brand = bar.querySelector(".m-stage-brand");
  if (brand) { brand.querySelector("b").textContent = "Genesis"; brand.querySelector("small").textContent = "Member App"; }
  var desk = bar.querySelector(".m-stage-desk");
  if (desk) desk.className = "v2-button m-stage-desk";
  var theme = bar.querySelector(".gm-theme-btn");
  if (theme) theme.className = "v2-button v2-icon-button v2-button-quiet gm-theme-btn";
  var tour = document.createElement("button");
  tour.type = "button";
  tour.className = "v2-button v2-button-quiet gm-tour-btn mx-tour";
  tour.setAttribute("data-gm-action", "start-tour");
  tour.setAttribute("aria-label", "Take the Tour");
  tour.title = "Take the Tour";
  tour.innerHTML = GM.v2Icon("help") + "<span>Take the Tour</span>";
  tour.hidden = !!(GM.ctx && GM.ctx.locked);
  bar.insertBefore(tour, desk || theme || null);

  var SCREENS = [
    ["member-signin.html", "Sign In", "member-app"], ["member-welcome.html", "First Question", "member-app"],
    ["member-home.html", "Home", "member-app"], ["member-notes.html", "Sunday's Notes", "member-app"],
    ["member-devotional.html", "Devotional", "member-app"], ["member-prayer.html", "Prayer", "member-app"],
    ["member-messages.html", "Messages", "member-app"], ["member-give.html", "Give", "member-app"],
    ["member-gifts.html", "Gifts Conversation", "member-gifts"], ["member-gifts-result.html", "Gifts to Explore", "member-gifts"]
  ];
  var nav = SCREENS.map(function (s) {
    var code = D.levels[GM.moduleLevel(s[2]) - 1].code, locked = !GM.isIncluded(s[2]);
    return '<a href="' + s[0] + '"' + (s[0] === here ? ' aria-current="page"' : "") + "><span>" + esc(s[1]) + "</span>" +
      (locked ? '<em class="gm-nav-lock" title="Included in ' + esc(code) + '">' + GM.icon("lock") + esc(code) + '</em><span class="sr-only">, included in ' + esc(code) + "</span>" : "") + "</a>";
  }).join("");
  var landLock = "";
  if (o.land && o.land.module && !GM.isIncluded(o.land.module)) {
    var landCode = D.levels[GM.moduleLevel(o.land.module) - 1].code;
    landLock = '<em class="gm-nav-lock" title="Included in ' + esc(landCode) + '" aria-hidden="true">' + GM.icon("lock") + esc(landCode.replace("Level ", "L")) + '</em><span class="sr-only">, included in ' + esc(landCode) + "</span>";
  }
  var protect = (o.protect || []).map(function (p) { return "<li><b>" + esc(GM.fill(p[0])) + "</b><span>" + esc(GM.fill(p[1])) + "</span></li>"; }).join("");
  var about = '<aside class="mx-about" aria-labelledby="mx-about-title">' +
    '<header class="v2-page-head"><div><div class="v2-eyebrow">Member app · ' + esc(c.short) + "</div>" +
    '<h2 class="v2-serif-title" id="mx-about-title">' + o.title + "</h2><p>" + esc(GM.fill(o.sub)) + "</p></div></header>" +
    (protect ? '<section class="v2-card mx-card" aria-label="How this screen protects people"><div class="v2-eyebrow">How it protects people</div><ul class="gm-protect-list">' + protect + "</ul></section>" : "") +
    (o.land ? '<a class="v2-button mx-land" href="' + esc(o.land.href) + '">' + GM.v2Icon(o.land.icon || "arrow") + "<span>" + esc(o.land.label) + "</span>" + landLock + "</a>" : "") +
    "</aside>";
  var screens = '<nav class="v2-card mx-screens" aria-label="Member app screens"><div class="v2-eyebrow">Member app screens</div><div class="v2-rail-nav">' + nav + "</div>" +
    '<p class="mx-fine">Every screen wears ' + esc(GM.poss(c.name)) + " own brand. Powered by Genesis.</p></nav>";
  var device = stage.querySelector(".m-device");
  device.insertAdjacentHTML("afterend", about + screens);
}
</script><!-- end member stage -->
<script>
/* Reading comfort (the same on member-notes.html and member-devotional.html): text size A- and A+, and on the
   bright looks Night Reading, kept on this phone in localStorage when it can be, and fine without it. */
function mxRead(slot) {
  "use strict";
  var app = document.querySelector(".m-app") || document.body, KEY = "gm.m.read", SIZES = [1, 1.12, 1.25, 1.4];
  var bright = !GM.church.theme || GM.church.theme.scheme !== "dark";
  var st = { size: 0, night: false };
  try { var v = JSON.parse(localStorage.getItem(KEY) || "null"); if (v) { st.size = Math.max(0, Math.min(SIZES.length - 1, +v.size || 0)); st.night = !!v.night; } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function apply() {
    app.style.setProperty("--mx-read", String(SIZES[st.size]));
    app.classList.toggle("mx-night", bright && st.night);
    slot.innerHTML = '<button type="button" class="m-btn" data-mx-size="-1" aria-label="Smaller text"' + (st.size === 0 ? " disabled" : "") + ">A−</button>" +
      '<button type="button" class="m-btn" data-mx-size="1" aria-label="Larger text"' + (st.size === SIZES.length - 1 ? " disabled" : "") + ">A+</button>" +
      (bright ? '<button type="button" class="m-btn" data-mx-night aria-pressed="' + st.night + '">Night Reading</button>' : "");
  }
  slot.classList.add("mx-read"); slot.setAttribute("role", "group"); slot.setAttribute("aria-label", "Reading");
  slot.addEventListener("click", function (e) {
    var s = e.target.closest("[data-mx-size]"), n = e.target.closest("[data-mx-night]");
    if (s && !s.disabled) { st.size = Math.max(0, Math.min(SIZES.length - 1, st.size + +s.getAttribute("data-mx-size"))); save(); apply(); var b = slot.querySelector('[data-mx-size="' + s.getAttribute("data-mx-size") + '"]'); (b && !b.disabled ? b : slot.querySelector("[data-mx-size]:not([disabled])")).focus(); }
    if (n) { st.night = !st.night; save(); apply(); slot.querySelector("[data-mx-night]").focus(); }
  });
  apply();
}
</script>
<script>
mxStage({
  title: 'Sunday\'s notes, <em class="v2-accent-em">one tap away</em>',
  sub: "The message, the scripture and questions for small groups, shaped from the pastor's own words and in {church.namePoss} own brand.",
  protect: [
    ["The pastor's own words", "Shaped from the pastor's own notes. {assistant.name} adds no teaching."],
    ["Scripture word for word", "Printed as written, with its translation named."],
    ["Email only if they chose it", "Members choose notes by email in My Profile."]
  ],
  land: { href: "church-notes.html", label: "See the Notes Screen", icon: "note", module: "notes" }
});
GM.ready(function (ctx) {
  "use strict";
  var esc = GM.esc, c = ctx.church, N = window.GM_NOTES, NC = N.church(c.slug);
  var $ = function (id) { return document.getElementById(id); };
  var id = ctx.params.get("id"), n = id ? N.find(c.slug, id) : null;
  var PREVIEW = ctx.params.get("preview") === "1" && n && n.status === "draft";
  var dec = n ? N.decision(n.id) : { state: "" };
  /* A draft shows only once the pastor has tapped Schedule or Publish (church-note.html), or as the pastor's own preview. */
  if (!n || n.kind !== "sermon" || (n.status === "draft" && !dec.state && !PREVIEW)) n = NC.sermons[0];
  if (n.status === "draft") n = N.shaped(n);
  var speaker = N.speaker(n, c.pastors);
  var latest = NC.sermons[0];
  var back = ""; try { back = sessionStorage.getItem("gm.notes.back") || ""; } catch (e) {}
  /* The demo clock is a Thursday. "See It on Sunday Morning" (?day=sun) shows the latest notes as on the Sunday they
     were preached, at 8:30 AM: Follow Along comes first. */
  var SUNDAY = ctx.params.get("day") === "sun" || N.weekday(N.today) === "Sunday";

  if (n.status === "draft") {
    $("mn-sched").hidden = false;
    $("mn-sched").innerHTML = GM.icon("info") + "<span>" + esc(PREVIEW && !dec.state ? "Preview: members see these after you tap Schedule. Demo only. Nothing was sent." : dec.state === "published" ? "Demo preview: published by " + speaker + " just now." : "Demo preview: scheduled for " + (dec.when || N.dateLong(n.date) + " at " + NC.sundayAt) + ". Members see it then.") +
      (PREVIEW && back ? ' <a href="' + esc(back) + '">Back to the Editor</a>' : "") + "</span>";
  }
  $("mn-eyebrow").textContent = n.series + " · " + n.part;
  $("mn-title").textContent = n.title;
  /* When only part of the passage is printed, the meta names the passage and the block says Key verse. */
  var KEY = N.keyLabel(n);
  $("mn-meta").innerHTML = esc(speaker + " · " + N.dateLong(n.date) + (n.length ? " · " + n.length : "")) + " · " + (KEY ? "Passage: " : "") + N.refHTML(n.ref);
  function verseHTML(v) { return '<blockquote class="mn-verse">' + (KEY ? '<span class="mn-key">' + esc(KEY) + "</span>" : "") + "<b>" + N.refHTML(v.ref) + "</b><p>" + esc(v.text) + "</p><small>" + esc(N.translation) + "</small></blockquote>"; }
  $("mn-scripture").innerHTML = n.verses.map(verseHTML).join('<div style="height:10px"></div>');
  $("mn-qs").innerHTML = n.questions.map(function (q) { return "<li>" + esc(q) + "</li>"; }).join("");
  $("mn-week").innerHTML = "<b>For this week</b>" + esc(n.week);
  /* The site's player plays the latest message only, so only the latest notes offer Watch the Message. */
  var current = n.id === latest.id || n.status === "draft";
  var followFirst = SUNDAY && current;
  var watch = c.site + NC.watch;
  var watchBtn = n.id === latest.id ? '<a class="m-btn' + (followFirst ? "" : " m-btn--primary") + '" href="' + esc(watch) + '">' + GM.icon("play") + "Watch the Message</a>"
    : n.status === "draft" ? '<p class="mn-novideo">The video goes up after Sunday, when the message is online.</p>'
    : '<a class="m-btn m-btn--primary" href="' + esc(watch) + '">' + GM.icon("play") + "Watch the Latest Message</a>";
  $("mn-btns").innerHTML = watchBtn + '<a class="m-btn" href="member-devotional.html">' + GM.icon("note") + "Today's Devotional</a>";
  $("mn-earlier").innerHTML = NC.sermons.filter(function (s) { return s.id !== n.id; }).map(function (s) {
    return '<li><a class="m-item" href="member-notes.html?id=' + esc(s.id) + '">' + GM.icon("note") + '<span class="m-item-main"><span class="m-item-title" style="display:block">' + esc(s.title) + '</span><span class="m-item-sub" style="display:block">' + N.refHTML(s.ref) + " · " + esc(N.dateLong(s.date)) + "</span></span></a></li>";
  }).join("");
  GM.carryLinks($("mn-earlier"));
  $("mn-note").innerHTML = GM.icon("shield") + "<span>Shaped from " + esc(speaker) + "'s own words. Scripture is the " + esc(N.translation) + ".</span>";
  mxRead($("mn-read"));

  /* ---------- My notes: kept in this browser tab only (sessionStorage), never sent ---------- */
  var MY = "gm.notes.my." + n.id + ".";
  function myGet(k) { try { return sessionStorage.getItem(MY + k) || ""; } catch (e) { return ""; } }
  function mySet(k, v) { try { if (v) sessionStorage.setItem(MY + k, v); else sessionStorage.removeItem(MY + k); } catch (e) {} }
  function paintPoints() {
    $("mn-points").innerHTML = n.points.map(function (p, i) {
      var mine = myGet("p" + i);
      return "<li>" + esc(p) + (mine ? '<span class="mn-mine"><b>My note</b>' + esc(mine) + "</span>" : "") + "</li>";
    }).join("");
    if (n.more && n.more.length) { $("mn-deeper").hidden = false; $("mn-deeper").innerHTML = "<b>From the message</b><p>" + esc(n.more.join(" ")) + "</p>"; }
  }
  paintPoints();

  /* ---------- Following along: the scripture, then each key point, then the questions, one screen at a time ---------- */
  var STEPS = [{ k: "s", label: "Scripture" }].concat(n.points.map(function (p, i) { return { k: "p" + i, label: "Point " + (i + 1) + " of " + n.points.length, i: i }; }), [{ k: "g", label: "For small groups" }]);
  var at = 0;
  function paintFollow() {
    var s = STEPS[at], last = at === STEPS.length - 1;
    $("mn-follow-count").textContent = s.label;
    var body = s.k === "s" ? n.verses.map(function (v) { return '<blockquote class="mn-verse mn-follow-verse">' + (KEY ? '<span class="mn-key">' + esc(KEY) + "</span>" : "") + "<b>" + N.refHTML(v.ref) + "</b><p>" + esc(v.text) + "</p><small>" + esc(N.translation) + "</small></blockquote>"; }).join("")
      : s.k === "g" ? '<ol class="mn-qs mn-follow-qs">' + n.questions.map(function (q) { return "<li>" + esc(q) + "</li>"; }).join("") + '</ol><p class="mn-week"><b>For this week</b>' + esc(n.week) + "</p>"
      : '<p class="mn-follow-point">' + esc(n.points[s.i]) + "</p>";
    $("mn-follow-body").innerHTML = body;
    $("mn-my-text").value = myGet(s.k);
    $("mn-my-help").hidden = !(window.HOPE_WORDS && HOPE_WORDS.safety && HOPE_WORDS.safety($("mn-my-text").value));
    $("mn-follow-prev").disabled = at === 0;
    $("mn-follow-next").textContent = last ? "Back to the Notes" : at === 0 ? "First Point" : s.i === n.points.length - 1 ? "Small Groups" : "Next Point";
    $("mn-copy-wrap").hidden = !last;
    $("mn-copy-note").hidden = true;
  }
  function follow(on) {
    document.body.classList.toggle("mn-following", on);
    $("mn-follow").hidden = !on;
    if (on) { paintFollow(); $("mn-follow-count").setAttribute("tabindex", "-1"); $("mn-follow-count").focus({ preventScroll: true }); window.scrollTo(0, 0); var app = document.querySelector(".m-device > .m-app"); if (app) app.scrollTop = 0; }
    else { paintPoints(); $("mn-follow-go").focus({ preventScroll: true }); }
  }
  function move(d) { var j = at + d; if (j < 0) return; if (j >= STEPS.length) { follow(false); return; } at = j; paintFollow(); }
  if (current) {
    $("mn-follow-go").hidden = false;
    $("mn-follow-go").className = "m-btn mn-follow-go" + (followFirst ? " m-btn--primary" : "");
    $("mn-follow-go").innerHTML = GM.icon("note") + "Follow Along";
    $("mn-follow-title-line").textContent = n.title;
    $("mn-follow-go").addEventListener("click", function () { at = 0; follow(true); });
    $("mn-follow-done").addEventListener("click", function () { follow(false); });
    $("mn-follow-prev").addEventListener("click", function () { move(-1); });
    $("mn-follow-next").addEventListener("click", function () { move(1); });
    $("mn-my-text").addEventListener("input", function () { mySet(STEPS[at].k, this.value); $("mn-my-help").hidden = !(window.HOPE_WORDS && HOPE_WORDS.safety && HOPE_WORDS.safety(this.value)); });
    $("mn-copy").addEventListener("click", function () { $("mn-copy-note").hidden = false; GM.toast("Demo only. Nothing was sent."); });
    /* A swipe left or right moves a step, as the two buttons do. */
    var x0 = null, y0 = null;
    $("mn-follow").addEventListener("touchstart", function (e) { if (e.target.closest("textarea")) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    $("mn-follow").addEventListener("touchend", function (e) { if (x0 == null) return; var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) move(dx < 0 ? 1 : -1); }, { passive: true });
    /* On a weekday the demo offers the Sunday morning view, where Follow Along comes first. */
    if (!SUNDAY && n.id === latest.id) { $("mn-sunday").hidden = false; $("mn-sunday").innerHTML = '<a class="m-btn m-btn--sm" href="' + esc(GM.url("member-notes.html", { id: n.id, day: "sun" })) + '">Preview: Follow Along During the Sermon</a>'; }
    if (SUNDAY && n.id === latest.id) { $("mn-sunday").hidden = false; $("mn-sunday").textContent = "Demo: Sunday, " + N.dateLong(n.date).replace(/^Sunday, /, "") + ", at " + NC.sundayAt + ", as members sit down."; }
    if (ctx.params.get("follow") === "1") { at = 0; follow(true); }
  }
  GM.setTour([
    { target: '[data-tour="mnotes.head"]', title: "Sunday's notes", text: "The message from Sunday." },
    { target: '[data-tour="mnotes.scripture"]', title: "Scripture word for word", text: "With its translation named." },
    { target: '[data-tour="mnotes.points"]', title: "The pastor's own points", text: "No teaching added." },
    { target: '[data-tour="mnotes.questions"]', title: "For small groups", text: "Questions and one thing to try." }
  ]);
});
</script>
</body>
</html>
